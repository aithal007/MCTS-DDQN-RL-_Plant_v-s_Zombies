[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pvz-rl"
version = "0.1.0"
description = "Reinforcement learning for Plants vs Zombies (Pygame simulator + Steam OG)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.24",
    "pygame>=2.5",
    "stable-baselines3>=2.2",
    "torch>=2.0",
    "tensorboard>=2.14",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
steam = [
    "mss>=9.0",
    "pyautogui>=0.9",
    "pywin32>=306",
    "opencv-python>=4.8",
    "pillow>=10.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.entry-points."gymnasium.envs"]
__root__ = "pvz_rl.__init__:register_envs"

[tool.setuptools.packages.find]
include = ["pvz_rl*"]

[tool.ruff]
line-length = 100
